
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Math Zombies">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="/manifest.json">
    <title>Math vs Zombies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
    <style>
      body {
        overscroll-behavior: none;
        touch-action: none;
        font-family: 'Titan One', cursive;
        background-color: #0f172a;
      }
      
      img, svg {
        image-rendering: auto;
        shape-rendering: optimizeSpeed;
      }

      .gpu-accelerated {
        transform: translateZ(0);
        will-change: left, transform;
        backface-visibility: hidden;
        perspective: 1000px;
      }

      @keyframes float {
        0% { transform: translate3d(0, 0, 0); }
        50% { transform: translate3d(0, -8px, 0); }
        100% { transform: translate3d(0, 0, 0); }
      }
      .animate-float { animation: float 3s ease-in-out infinite; }

      @keyframes zombieWalk {
        0% { transform: translate3d(-50%, 0, 0) rotate(-3deg); }
        50% { transform: translate3d(-50%, -5px, 0) rotate(3deg); }
        100% { transform: translate3d(-50%, 0, 0) rotate(-3deg); }
      }
      .animate-walk { animation: zombieWalk 1.2s infinite linear; }
      
      .animate-hit { filter: brightness(2) contrast(1.5); }

      @keyframes shakeDying {
        0% { transform: translate3d(-50%, 0, 0) rotate(0deg); }
        25% { transform: translate3d(-52%, 0, 0) rotate(-5deg); }
        50% { transform: translate3d(-48%, 0, 0) rotate(5deg); }
        75% { transform: translate3d(-52%, 0, 0) rotate(-5deg); }
        100% { transform: translate3d(-50%, 0, 0) rotate(0deg); }
      }
      .animate-dying { animation: shakeDying 0.2s infinite; }
      
      @keyframes flash {
          0% { opacity: 1; }
          100% { opacity: 0; }
      }
      .animate-flash { animation: flash 0.5s ease-out forwards; }

      .wood-panel {
        background-color: #1e293b; /* Darker Slate for Night */
        border: 4px solid #334155;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0,0,0,0.8);
      }

      .glossy-btn {
        background-color: #22c55e;
        border-bottom: 4px solid #166534;
        border-radius: 8px;
        transition: transform 0.1s;
      }
      .glossy-btn:active {
        transform: translateY(4px);
        border-bottom: 0;
      }
      
      .glossy-red {
        background-color: #ef4444;
        border-bottom: 4px solid #991b1b;
      }

      /* NEON NIGHT LAWN */
      .lawn-bg {
        background-color: #064e3b;
        background-image: 
          linear-gradient(45deg, #065f46 25%, transparent 25%, transparent 75%, #065f46 75%, #065f46), 
          linear-gradient(45deg, #065f46 25%, transparent 25%, transparent 75%, #065f46 75%, #065f46);
        background-size: 60px 60px;
        background-position: 0 0, 30px 30px;
        box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
      }

      #rotate-warning {
        display: none;
      }
      @media screen and (orientation: portrait) {
        #rotate-warning {
          display: flex !important;
        }
      }
    </style>
<script type="importmap">
{
  "imports": {
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "vite": "https://esm.sh/vite@^7.3.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-950 text-white overflow-hidden select-none">
    <div id="root"></div>
    <div id="rotate-warning" class="fixed inset-0 z-[100] bg-slate-950 flex-col items-center justify-center text-center p-8">
      <div class="text-6xl mb-4 animate-bounce">🔄</div>
      <h1 class="text-3xl text-emerald-400 font-bold mb-4">가로로 돌려주세요!</h1>
      <p class="text-slate-400">밤의 정원은 가로 모드에서 더 잘 보입니다.</p>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
