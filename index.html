
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Math Zombies">
    <meta name="theme-color" content="#4a2c2a">
    <link rel="manifest" href="/manifest.json">
    <title>Math vs Zombies</title>
    <!-- We keep CDN for Tailwind to keep it simple, but in a real prod app, installing it via postcss is better. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Titan One font for that "Mobile Game" cartoon look -->
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
    <style>
      body {
        overscroll-behavior: none;
        touch-action: none;
        font-family: 'Titan One', cursive;
        background-color: #2a2a2a;
      }
      
      /* PERFORMANCE FIX: No Filters, No fancy rendering */
      img, svg {
        image-rendering: auto;
        shape-rendering: optimizeSpeed; /* Prefer speed over geometry precision */
      }

      /* GPU Acceleration Class for Moving Entities */
      /* FIXED: Removed 'will-change' to prevent layer explosion/ghosting on iOS */
      .gpu-accelerated {
        transform: translateZ(0);
        backface-visibility: hidden;
        perspective: 1000px;
      }

      /* Simplified Animations */
      @keyframes float {
        0% { transform: translate3d(0, 0, 0); }
        50% { transform: translate3d(0, -8px, 0); }
        100% { transform: translate3d(0, 0, 0); }
      }
      .animate-float { animation: float 3s ease-in-out infinite; }

      @keyframes zombieWalk {
        0% { transform: translate3d(-50%, 0, 0) rotate(-3deg); }
        50% { transform: translate3d(-50%, -5px, 0) rotate(3deg); }
        100% { transform: translate3d(-50%, 0, 0) rotate(-3deg); }
      }
      .animate-walk { animation: zombieWalk 1.2s infinite linear; }

      /* Removed complex animations (Attack, Shoot) to reduce compositing layers on old devices */
      
      .animate-hit { filter: brightness(2); } /* Simple brightness instead of complex transform */

      @keyframes shakeDying {
        0% { transform: translate3d(-50%, 0, 0) rotate(0deg); }
        25% { transform: translate3d(-52%, 0, 0) rotate(-5deg); }
        50% { transform: translate3d(-48%, 0, 0) rotate(5deg); }
        75% { transform: translate3d(-52%, 0, 0) rotate(-5deg); }
        100% { transform: translate3d(-50%, 0, 0) rotate(0deg); }
      }
      .animate-dying { animation: shakeDying 0.2s infinite; }
      
      /* Add Flash Animation for Revenge Success */
      @keyframes flash {
          0% { opacity: 1; }
          100% { opacity: 0; }
      }
      .animate-flash { animation: flash 0.5s ease-out forwards; }

      /* UI Textures - Simplified */
      .wood-panel {
        background-color: #8d6e63;
        /* Removed gradient texture for performance */
        border: 4px solid #4e342e;
        border-radius: 12px;
        box-shadow: 0 4px 0 rgba(0,0,0,0.5); /* Simple shadow */
      }

      .glossy-btn {
        background-color: #16a34a; /* Flat color */
        border-bottom: 4px solid #14532d;
        border-radius: 8px;
        transition: transform 0.1s;
      }
      .glossy-btn:active {
        transform: translateY(4px);
        border-bottom: 0;
      }
      
      .glossy-red {
        background-color: #ef4444;
        border-bottom: 4px solid #991b1b;
      }
      .glossy-red:active {
        transform: translateY(4px);
        border-bottom: 0;
      }

      /* Simplified Lawn */
      .lawn-bg {
        background-color: #4ade80;
        /* Sharper checkerboard with Borders */
        background-image: 
          linear-gradient(45deg, #22c55e 25%, transparent 25%, transparent 75%, #22c55e 75%, #22c55e), 
          linear-gradient(45deg, #22c55e 25%, transparent 25%, transparent 75%, #22c55e 75%, #22c55e);
        background-size: 40px 40px;
        background-position: 0 0, 20px 20px;
      }

      /* Orientation Lock Warning */
      #rotate-warning {
        display: none;
      }
      @media screen and (orientation: portrait) {
        #rotate-warning {
          display: flex !important;
        }
      }
    </style>
<script type="importmap">
{
  "imports": {
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "vite": "https://esm.sh/vite@^7.3.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-stone-900 text-white overflow-hidden select-none">
    <div id="root"></div>
    
    <!-- Rotate Warning Overlay -->
    <div id="rotate-warning" class="fixed inset-0 z-[100] bg-black flex-col items-center justify-center text-center p-8">
      <div class="text-6xl mb-4 animate-bounce">🔄</div>
      <h1 class="text-3xl text-yellow-400 font-bold mb-4">가로로 돌려주세요!</h1>
      <p class="text-stone-300">이 게임은 가로 모드에 최적화되어 있습니다.</p>
    </div>

    <script type="module" src="/index.tsx"></script>
  </body>
</html>
