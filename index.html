
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Math Zombies">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="/manifest.json">
    <title>Math vs Zombies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
    <style>
      body {
        overscroll-behavior: none;
        touch-action: none;
        font-family: 'Titan One', cursive;
        background-color: #0f172a;
        margin: 0;
        padding: 0;
      }
      
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .gpu-accelerated {
        transform: translateZ(0);
        will-change: left, transform, filter;
        backface-visibility: hidden;
      }

      @keyframes float {
        0% { transform: translate3d(0, 0, 0); }
        50% { transform: translate3d(0, -5px, 0); }
        100% { transform: translate3d(0, 0, 0); }
      }
      .animate-float { animation: float 3s ease-in-out infinite; }

      @keyframes zombieWalk {
        0% { transform: translate3d(-50%, 0, 0) rotate(-2deg); }
        50% { transform: translate3d(-50%, -3px, 0) rotate(2deg); }
        100% { transform: translate3d(-50%, 0, 0) rotate(-2deg); }
      }
      .animate-walk { animation: zombieWalk 1.2s infinite linear; }
      
      @keyframes screenshake {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(-2px, 2px); }
        50% { transform: translate(2px, -2px); }
        75% { transform: translate(-1px, -1px); }
      }
      .screenshake { animation: screenshake 0.1s infinite; }

      @keyframes zombieHit {
        0% { filter: brightness(3); transform: scale(1.1) rotate(0deg); }
        100% { filter: brightness(1); transform: scale(1) rotate(10deg) translateX(5px); }
      }
      .animate-zombie-hit { animation: zombieHit 0.2s ease-out forwards; }

      .lawn-bg {
        background-color: #064e3b;
        background-image: 
          repeating-linear-gradient(90deg, transparent, transparent 11.11%, rgba(0,0,0,0.1) 11.11%, rgba(0,0,0,0.1) 22.22%),
          linear-gradient(to bottom, #065f46 0%, #064e3b 100%);
        box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
        position: relative;
      }
      
      .wood-panel {
        background-color: #2d1b14;
        border: 3px solid #5d4037;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      }

      .glossy-btn {
        background-color: #22c55e;
        border-bottom: 4px solid #166534;
        border-radius: 8px;
        transition: transform 0.1s;
      }
      .glossy-btn:active {
        transform: translateY(2px);
        border-bottom-width: 2px;
      }

      #rotate-warning { display: none; }
      @media screen and (orientation: portrait) {
        #rotate-warning { display: flex !important; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3",
    "vite": "https://esm.sh/vite@^7.3.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-950 text-white overflow-hidden select-none">
    <div id="root"></div>
    <div id="rotate-warning" class="fixed inset-0 z-[100] bg-slate-950 flex-col items-center justify-center text-center p-8">
      <div class="text-6xl mb-4 animate-bounce">🔄</div>
      <h1 class="text-3xl text-emerald-400 font-bold mb-4">가로로 돌려주세요!</h1>
      <p class="text-slate-400">더 넓은 정원이 구구단 실력을 기다리고 있습니다.</p>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
